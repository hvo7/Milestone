# Builds the web/mobile PWA and publishes it to GitHub Pages (free on public repos).
# The desktop Electron build is untouched by this — same source, different shell.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish without pushing, from the Actions tab.
  workflow_dispatch:

# Pages deploys are authorised by OIDC, not a PAT — hence id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should supersede an in-flight deploy rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly; it will fail
      # loudly rather than silently resolving different versions than local.
      - run: npm ci

      # Deploying a build whose recurrence engine is broken is worse than not
      # deploying: the failure is silent and lands in someone's saved data.
      - run: npm test

      # Regenerates public/pwa-*.png from logo.svg so the installed icon can never
      # drift from the source mark. Icons are gitignored for the same reason.
      - run: npm run generate-icons

      - run: npm run build

      # `enablement` turns Pages on via the API rather than failing when it has
      # never been switched on by hand. Without it this step dies with a bare
      # "Get Pages site failed / Not Found" on a repo whose Pages was never set up.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
