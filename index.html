<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- viewport-fit=cover lets the dark background run under the notch and the
         home-bar area when installed on a phone; env(safe-area-inset-*) in the CSS
         keeps content itself clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installable web build. Electron ignores all of this. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0c12" />
    <meta name="description" content="Quest-driven goal and habit tracker." />

    <!-- iOS ignores the manifest for home-screen installs and reads these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milestone" />
    <!-- Full-bleed and opaque at iOS's native 180px: it masks the icon itself and
         paints any transparency white, so an inset or round-cornered source came
         back ringed in white on the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-apple-180.png" />

    <title>Milestone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
